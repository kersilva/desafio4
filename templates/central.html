<!doctype html>
<html lang="pt-BR">

<head>
    <title>Bloco de notas - Central {{ cd }}</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-stone-900 text-stone-100">
    
    <div class="fixed bottom-5 right-5 z-40">
        <a 
        href="{{ url_for('main.nova_nota', central=cd) }}"
        class="bg-yellow-500 size-14 rounded-full flex items-center justify-center text-white text-3xl cursor-pointer hover:bg-yellow-600 transition-colors shadow-lg">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-6">
            <path fill-rule="evenodd" d="M12 3.75a.75.75 0 0 1 .75.75v6.75h6.75a.75.75 0 0 1 0 1.5h-6.75v6.75a.75.75 0 0 1-1.5 0v-6.75H4.5a.75.75 0 0 1 0-1.5h6.75V4.5a.75.75 0 0 1 .75-.75Z" clip-rule="evenodd" />
        </svg>
    </a>
</div>

<main class="px-5 pt-15 pb-5 flex flex-col gap-5 max-w-[60rem] mx-auto">
    <div class="mb-5">
        <a href="{{ url_for('main.codigo') }}" class="text-yellow-500 hover:underline">&lt; Sair</a>
    </div>
    
    <h1 class="text-4xl font-bold mb-5">Notas</h1>
    
    <div class="relative grid grid-cols-1 lg:grid-cols-2 gap-5 text-stone-100
    [&>a]:relative [&>a]:bg-stone-800 [&>a]:w-full [&>a]:rounded-xl [&>a]:px-5 [&>a]:py-5 [&>a]:overflow-hidden [&>a]:block [&>a]:border-b-3 [&>a]:border-yellow-500
    [&>a>div]:relative [&>a>div]:z-2 [&>a>div]:text-stone-900 [&>a>div]:flex [&>a>div]:flex-col [&>a>div]:gap-1
    [&_.title]:text-2xl [&_.title]:text-white [&_.title]:font-semibold [&_.title]:line-clamp-1 [&_.title]:lg:text-xl
    [&_.desc]:text-lg [&_.desc]:text-white/70 [&_.desc]:line-clamp-2 [&_.desc]:lg:text-sm
    [&_.date]:text-sm [&_.date]:text-stone-400 [&_.date]:flex [&_.date]:items-center [&_.date]:gap-1 [&_.date]:mt-6 [&_.date]:w-fit [&_.date]:py-1 [&_.date]:rounded-full [&_.date]:lg:text-xs">
    
    {% for nota in notas %}
    <a href="{{ url_for('main.nota', central=cd, nota=nota.id) }}">
        <div>
            <button type="button" class="absolute text-stone-500 hover:text-stone-100 right-0 top-0 z-30 cursor-pointer p-1" onclick="event.stopPropagation(); event.preventDefault(); window.location.href='{{ url_for('main.deletar_nota', central=cd, id_nota=nota.id) }}';">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="size-5">
                    <path fill-rule="evenodd" d="M8.75 1A2.75 2.75 0 0 0 6 3.75v.443c-.795.077-1.584.176-2.365.298a.75.75 0 1 0 .23 1.482l.149-.022.841 10.518A2.75 2.75 0 0 0 7.596 19h4.807a2.75 2.75 0 0 0 2.742-2.53l.841-10.52.149.023a.75.75 0 0 0 .23-1.482A41.03 41.03 0 0 0 14 4.193V3.75A2.75 2.75 0 0 0 11.25 1h-2.5ZM10 4c.84 0 1.673.025 2.5.075V3.75c0-.69-.56-1.25-1.25-1.25h-2.5c-.69 0-1.25.56-1.25 1.25v.325C8.327 4.025 9.16 4 10 4ZM8.58 7.72a.75.75 0 0 0-1.5.06l.3 7.5a.75.75 0 1 0 1.5-.06l-.3-7.5Zm4.34.06a.75.75 0 1 0-1.5-.06l-.3 7.5a.75.75 0 1 0 1.5.06l.3-7.5Z" clip-rule="evenodd" />
                </svg>
                
            </button>
            
            <span class="title">{{ nota.titulo }}</span>
            <span class="desc">{% if nota.texto %}{{ nota.texto }}{% else %}<em class="text-stone-500 text-sm">Nenhum conteúdo...</em>{% endif %}</span>
            <span class="date">Criada em: {{ nota.data_criacao.strftime('%d/%m/%Y às %H:%M') }}</span>
        </div>
    </a>
    {% else %}
    <div class="flex text-center py-10 text-stone-500">
        <p class="text-lg">Nenhuma nota encontrada nesta central. <a href="{{ url_for('main.nova_nota', central=cd) }}" class="text-yellow-500 hover:underline">Criar nova</a></p>
    </div>
    {% endfor %}
    
</div>
</main>
</body>
</html>
